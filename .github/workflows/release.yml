name: Release

# Every successful Test run on a push to master becomes a GitHub release tagged
# r<run number>, with a static linux/amd64 build and SHA256SUMS. Deploys pin a
# tag and check the download against SHA256SUMS.
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      TAG: r${{ github.run_number }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        run: |
          (cd frontend && npm ci && npm run build)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o luister .
          # the binary serves ./frontend/dist and ./templates from its working dir
          mkdir dist
          tar -czf dist/luister-linux-amd64.tar.gz luister frontend/dist templates
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --target "$SHA" --title "$TAG" --generate-notes
